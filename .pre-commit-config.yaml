repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^api/
      - id: ruff-format
        files: ^api/
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd web && pnpm exec prettier --write --ignore-unknown "${@#web/}"' --
        language: system
        files: ^web/
        exclude: ^web/pnpm-lock\.yaml$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
