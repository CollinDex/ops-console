repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (locked version via uv)
        entry: bash -c 'cd api && uv run ruff check --fix "${@#api/}"' --
        language: system
        types: [python]
        files: ^api/
      - id: ruff-format
        name: ruff format (locked version via uv)
        entry: bash -c 'cd api && uv run ruff format "${@#api/}"' --
        language: system
        types: [python]
        files: ^api/
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd web && pnpm exec prettier --write --ignore-unknown "${@#web/}"' --
        language: system
        files: ^web/
        exclude: ^web/pnpm-lock\.yaml$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key
