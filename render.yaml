# Render Blueprint: Postgres + the FastAPI service. The web app is deployed on Vercel (docs/deploy.md).
databases:
  - name: credisure-db
    plan: free
    databaseName: credisure
    user: credisure

services:
  - type: web
    name: credisure-api
    runtime: docker
    plan: free
    dockerContext: ./api
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: credisure-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # set in the Render dashboard: comma-separated Vercel URLs
      - key: ENV
        value: prod
      - key: PORT
        value: "8000"
