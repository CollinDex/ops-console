[project]
name = "credisure-api"
version = "0.1.0"
description = "CrediSure Ops Console API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=4.2",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.9",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]
"scripts/**" = ["S105", "S106", "S311"]
"app/providers/simulator.py" = ["S311"]
"app/providers/registry.py" = ["S311"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"
markers = ["slow: slower tests that still run by default"]
